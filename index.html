<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6e9"><meta name="apple-mobile-web-app-capable" content="yes"><title>小小畫室</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body><header><div><small>每個顏色，都屬於你</small><h1>小小畫室 <span>✦</span></h1></div><button id="gallery" aria-label="作品相簿">🖼️</button></header><nav aria-label="選擇畫板"><button data-scene="cat">🐱 貓咪</button><button data-scene="princess">👑 公主</button><button data-scene="blank">🎨 自己畫</button></nav><main><div id="paper"><svg id="coloring" viewBox="0 0 360 440" aria-label="點選區域填色"></svg><canvas id="drawing" width="720" height="880" aria-label="用手指畫畫"></canvas></div><p id="hint" role="status">選個顏色，幫貓咪穿上新衣服</p></main><footer><div id="palette" aria-label="顏色"></div><div class="tools"><button id="fill" aria-label="填色">🪣</button><button id="pen" aria-label="畫筆">🖍️</button><button id="rainbow" aria-label="彩虹筆">🌈</button><button id="eraser" aria-label="橡皮擦">🧽</button><button id="undo" aria-label="復原">↶</button><button id="redo" aria-label="重做">↷</button><button id="more" aria-label="更多工具">•••</button></div><div id="extras" hidden><label>筆刷 <input id="size" type="range" min="5" max="45" value="16"></label><label class="custom">更多顏色 <input id="custom" type="color" value="#ff7399"></label><button id="clear">🗑 清空</button><button id="download">↓ 存成圖片</button></div></footer><dialog id="album"><div class="dialog-head"><h2>我的小畫展</h2><button id="close" aria-label="關閉相簿">✕</button></div><p>作品存在這台裝置，點圖片可以下載。</p><div id="artworks"></div></dialog><script src="app.js"></script></body></html>
