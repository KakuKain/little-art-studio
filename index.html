<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6e9"><meta name="apple-mobile-web-app-capable" content="yes"><title>小小畫室</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=5"></head><body class="at-home"><section id="home" aria-label="選擇畫布"><div class="home-top"><button id="gallery" aria-label="作品相簿"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m3 17 6-5 4 4 4-6 4 5"/></svg></button></div><div id="home-grid"></div></section><main><div id="paper"><svg id="coloring" viewBox="0 0 360 440" aria-label="點選區域填色"></svg><canvas id="drawing" width="720" height="880" aria-label="用手指畫畫"></canvas></div><p id="hint" class="sr-only" role="status"></p></main><footer><div class="tools"><button id="home-back" aria-label="回首頁"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg></button><button id="color-open" aria-label="選擇顏色"><span id="color-preview"></span></button><button id="fill" aria-label="填色"><span class="tool-icon"></span></button><button id="pen" aria-label="畫筆"><span class="tool-icon"></span></button><button id="eraser" aria-label="橡皮擦"><span class="tool-icon"></span></button><button id="undo" aria-label="復原"><span class="tool-icon"></span></button><button id="more" aria-label="更多工具"><span class="tool-icon"></span></button></div></footer><dialog id="color-modal" aria-labelledby="color-title"><div class="dialog-head"><div><h2 id="color-title">顏色</h2></div><button class="dismiss" aria-label="關閉選色">✕</button></div><div id="palette" aria-label="常用顏色"></div><button id="rainbow"><span class="rainbow-swatch"></span><span>彩虹筆</span><span class="check">✓</span></button><div class="mix"><h3>調出自己的顏色</h3><div class="mix-row"><span id="mix-preview"></span><div><label>色相<input id="hue" type="range" min="0" max="360" value="340"></label><label>濃淡<input id="saturation" type="range" min="0" max="100" value="80"></label><label>明亮<input id="lightness" type="range" min="10" max="95" value="72"></label></div></div><button id="use-color">用這個顏色</button></div></dialog><dialog id="tool-modal" aria-labelledby="tool-title"><div class="dialog-head"><h2 id="tool-title">畫畫工具</h2><button class="dismiss" aria-label="關閉工具">✕</button></div><div id="extras"><label>筆刷大小 <input id="size" type="range" min="5" max="45" value="16"></label><button id="redo">↷ 重做</button><button id="download">↓ 存成圖片</button><button id="clear">清空畫布 <small>清空後仍可復原</small></button></div></dialog><dialog id="album"><div class="dialog-head"><h2>我的小畫展</h2><button id="close" aria-label="關閉相簿">✕</button></div><div id="artworks"></div></dialog><script src="app.js?v=5"></script></body></html>
