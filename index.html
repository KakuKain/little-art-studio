<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>小小畫家</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css?v=49" />
  </head>
  <body class="at-home">
    <section id="home" aria-label="選擇畫布">
      <div class="home-content">
        <div class="home-top">
          <button id="category-back" class="" aria-label="回分類首頁">
            <img src="assets/ui/back.svg" alt="" /><span class="tool-label"
              >回分類首頁</span
            >
          </button>
          <div class="category-title"><h2 id="category-title"></h2></div>
          <div class="home-actions">
            <button id="gallery" class="" aria-label="作品相簿">
              <img src="assets/ui/gallery.svg" alt="" /><span class="tool-label"
                >作品相簿</span
              ></button
            ><button id="settings-open" class="" aria-label="設定與資訊">
              <img src="assets/ui/settings.svg" alt="" /><span
                class="tool-label"
                >設定與資訊</span
              >
            </button>
          </div>
          <select id="difficulty" aria-label="圖案難度" hidden>
            <option value="simple">簡單</option>
            <option value="all">全部</option>
            <option value="detailed">細節較多</option>
          </select>
        </div>
        <div class="home-hero">
          <img src="assets/ui/sun.png" alt="" class="sun" />
          <h1>小小畫家</h1>
          <p>畫出你的想像力！</p>
        </div>
        <div id="home-grid"></div>
      </div>
    </section>
    <nav id="editor-nav" aria-label="畫布導覽">
      <button id="editor-back" class="" aria-label="回選圖">
        <img src="assets/ui/back.svg" alt="" /><span class="tool-label"
          >回選圖</span
        >
      </button>
      <div class="history-actions">
        <button id="undo" class="" aria-label="上一步">
          <img src="assets/ui/undo.svg" alt="" /><span class="tool-label"
            >上一步</span
          ></button
        ><button id="redo" class="" aria-label="下一步">
          <img src="assets/ui/redo.svg" alt="" /><span class="tool-label"
            >下一步</span
          >
        </button>
      </div>
      <div class="nav-actions">
        <button id="clear" aria-label="清除畫布">
          <img src="assets/ui/clear.svg" alt="" /></button
        ><button id="home-back" class="" aria-label="回首頁">
          <img src="assets/ui/home.svg" alt="" /><span class="tool-label"
            >回首頁</span
          >
        </button>
      </div>
    </nav>
    <main>
      <div id="paper">
        <svg id="coloring" viewBox="0 0 360 440" aria-label="點選區域填色"></svg
        ><canvas
          id="drawing"
          width="720"
          height="880"
          aria-label="用手指畫畫"
        ></canvas
        ><svg id="outlines" aria-hidden="true"></svg>
      </div>
      <p id="hint" class="sr-only" role="status"></p>
    </main>
    <footer>
      <div class="tools">
        <div class="main-tools">
          <button id="pen" class="" aria-label="鉛筆">
            <img src="assets/ui/pen.svg" alt="" /><span class="tool-label"
              >鉛筆</span
            >
          </button>
          <div class="size-control">
            <span class="size-dot" aria-hidden="true"></span
            ><input
              id="size"
              type="range"
              min="5"
              max="40"
              step="1"
              value="12"
              aria-label="鉛筆粗細"
            /><span class="size-dot large" aria-hidden="true"></span>
          </div>
          <button id="fill" class="" aria-label="填色">
            <img src="assets/ui/fill.svg" alt="" /><span class="tool-label"
              >填色</span
            ></button
          ><button id="eraser" class="" aria-label="橡皮擦">
            <img src="assets/ui/eraser.svg" alt="" /><span class="tool-label"
              >橡皮擦</span
            >
          </button>
        </div>
        <div class="action-tools">
          <button id="download" class="wide-only" aria-label="儲存">
            <img src="assets/ui/download.svg" alt="" /><span class="tool-label"
              >儲存</span
            ></button
          ><button id="fullscreen" class="wide-only" aria-label="全螢幕">
            <img src="assets/ui/fullscreen.svg" alt="" /><span
              class="tool-label"
              >全螢幕</span
            ></button
          ><button
            id="more"
            class=""
            aria-label="更多"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="tool-modal"
          >
            <img src="assets/ui/more.svg" alt="" /><span class="tool-label"
              >更多</span
            >
          </button>
        </div>
      </div>
      <div id="quick-colors" aria-label="顏色選擇">
        <button id="color-open" aria-label="目前顏色，開啟選色面板">
          <span id="color-preview"></span><span class="tool-label">顏色</span>
        </button>
      </div>
    </footer>
    <dialog id="color-modal" aria-labelledby="color-title">
      <div class="dialog-head">
        <div><h2 id="color-title">顏色</h2></div>
        <button class="dismiss" aria-label="關閉選色">✕</button>
      </div>
      <div id="palette" aria-label="常用顏色"></div>
      <button id="rainbow">
        <span class="rainbow-swatch"></span><span>彩虹筆</span
        ><span class="check">✓</span>
      </button>
      <div class="mix">
        <h3>調出自己的顏色</h3>
        <div class="mix-row">
          <span id="mix-preview"></span>
          <div>
            <label
              >色相<input
                id="hue"
                type="range"
                min="0"
                max="360"
                value="340" /></label
            ><label
              >濃淡<input
                id="saturation"
                type="range"
                min="0"
                max="100"
                value="80" /></label
            ><label
              >明亮<input
                id="lightness"
                type="range"
                min="10"
                max="95"
                value="72"
            /></label>
          </div>
        </div>
        <button id="use-color">用這個顏色</button>
      </div>
    </dialog>
    <div id="tool-modal" popover="auto" role="menu" aria-label="更多工具">
      <button data-action="download" role="menuitem">
        <img src="assets/ui/download.svg" alt="" /><span>存成圖片</span></button
      ><button data-action="fullscreen" role="menuitem">
        <img src="assets/ui/fullscreen.svg" alt="" /><span>全螢幕</span></button
      ><button id="about-open" role="menuitem">
        <img src="assets/ui/settings.svg" alt="" /><span>關於畫室</span>
      </button>
    </div>
    <dialog id="about-modal" aria-label="關於畫室">
      <div class="dialog-head">
        <h2>關於畫室</h2>
        <button class="dismiss" aria-label="關閉">✕</button>
      </div>
      <section class="offline-controls">
        <h3>離線圖片</h3>
        <label for="offline-category" class="sr-only">下載圖片分類</label
        ><select id="offline-category"></select
        ><button id="offline-download">下載這個分類</button>
        <p id="offline-status" role="status"></p>
      </section>
      <a
        class="credits"
        href="https://www.disneyclips.com/funstuff/disney-princess-coloring.html"
        target="_blank"
        rel="noopener"
        >公主線稿：Disneyclips.com · © Disney · 非商業使用</a
      ><a
        class="credits"
        href="https://thetoyzone.com/how-to-train-your-dragon-coloring-pages"
        target="_blank"
        rel="noopener"
        >小龍線稿：TheToyZone</a
      ><a
        class="credits"
        href="https://www.cutecoloring.page/how-to-train-your-dragon-coloring-pages"
        target="_blank"
        rel="noopener"
        >夜煞線稿：Cute Coloring · 非商業使用</a
      ><a
        class="credits"
        href="https://www.coloringbook.ai/how-to-train-your-dragon/toothlessand-light-fury-magical-encounter"
        target="_blank"
        rel="noopener"
        >光煞線稿參考：ColoringBook.ai · © DreamWorks</a
      ><a
        class="credits"
        href="https://www.gabbysdollhouse.com/fun"
        target="_blank"
        rel="noopener"
        >蓋比線稿：DreamWorks · © DreamWorks</a
      ><a
        class="credits"
        href="https://wakethekids.com/gabbys-dollhouse-coloring-pages/"
        target="_blank"
        rel="noopener"
        >蓋比角色線稿：WakeTheKids</a
      ><a
        class="credits"
        href="https://www.coloringpages101.com/Animated-Series/Gabbys-Dollhouse-coloring-pages"
        target="_blank"
        rel="noopener"
        >派對貓：ColoringPages101</a
      ><a
        class="credits"
        href="https://www.supercoloring.com/"
        target="_blank"
        rel="noopener"
        >夜煞補充圖：Supercoloring／使用者提供</a
      >
    </dialog>
    <dialog id="album">
      <div class="dialog-head">
        <h2>我的小畫展</h2>
        <button id="close" aria-label="關閉相簿">✕</button>
      </div>
      <div id="artworks"></div>
    </dialog>
    <div id="notice" role="status" hidden></div>
    <script type="module" src="app.js?v=49"></script>
  </body>
</html>
